[project]
name = "llmops-best-practice"
version = "0.1.0"
description = "llmops-best-practice"
readme = "README.md"
authors = [
    { name = "zhanghaifeng9988", email = "541099040@qq.com" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "anthropic>=2.8.0",
    "aws-lambda-powertools>=3.41.0",
    "beautifulsoup4>=4.15.0",
    "comet-ml>=3.59.0",
    "html2text>=2025.4.15",
    "langchain-community>=0.4.2",
    "langfuse>=5.2.0",
    "openai>=3.51.0",
    "opik>=2.2.138",
    "pika>=1.5.0",
    "pydantic-settings>=2.16.3",
    "pymongo>=4.20.1",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
    "structlog>=26.1.0",
]


[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# Lambda python:3.11 基础镜像为 Amazon Linux 2 (glibc 2.26)，
# 以下3个包的新版 wheel 仅支持 manylinux_2_28，压回提供 manylinux_2_17 wheel 的版本
# 因为 Lambda 镜像系统老，新版包装不上。别手贱升级。
constraint-dependencies = ["numpy<2.3", "tiktoken<0.9", "rapidfuzz<3.14"]

# torch 只从 CPU 专用源安装，避免拉下几个 GB 的 CUDA 依赖（本机 MX570 用不上）
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }


[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

